name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (Windows MSVC, Debug)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-msvc-debug

      - name: Build
        run: cmake --build --preset windows-msvc-debug --target gflow gflow_tests

      - name: Test
        run: ctest --preset windows-msvc-debug

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install clang-format 22
        run: pip install "clang-format~=22.1"
      - name: Check formatting
        run: |
          clang-format --version
          files=$(find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \))
          clang-format --dry-run -Werror --style=file $files

  clang-tidy:
    name: clang-tidy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install clang-tidy 22
        run: pip install "clang-tidy~=22.1"

      - name: Configure
        run: cmake --preset windows-msvc-debug

      - name: Run clang-tidy
        run: |
          clang-tidy --version
          $files = Get-ChildItem -Path src,tests -Recurse -Include *.cpp,*.h,*.hpp | ForEach-Object { $_.FullName }
          clang-tidy -p build --warnings-as-errors=* $files
